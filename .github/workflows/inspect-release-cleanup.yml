name: Inspect release cleanup

on:
  push:
    branches:
      - agent/unify-downloader-paths
    paths:
      - .github/workflows/inspect-release-cleanup.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unify-downloader-paths
      - name: Repository files
        run: find src -maxdepth 3 -type f -print | sort
      - name: Package manifest
        run: cat package.json
      - name: yt-dlp integration
        run: sed -n '1,320p' src/lib/ytdlp.ts
      - name: CLI entry
        run: sed -n '1,260p' src/cli.tsx
      - name: App routing
        run: sed -n '1,420p' src/app.tsx || sed -n '1,420p' src/App.tsx
