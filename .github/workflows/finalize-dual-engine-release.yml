      - name: Write complete installation and maintenance guide
        shell: bash
        run: |
          cat > README.md <<'MD'
          # yoinks

          <picture>
            <source media="(prefers-color-scheme: dark)" srcset="assets/logo-dark.svg">
            <img src="assets/logo-light.svg" alt="yoinks" width="288">
          </picture>

          Download videos, audio, images, galleries, manga, and mixed-media posts from one terminal interface.

          - `yt-dlp` handles Reels, videos, audio, formats, merging, and MP3 extraction.
          - `gallery-dl` handles images, carousels, manga, and posts containing both images and videos.
          - Managed tools are stored together under `~/.yoinks/bin`.

          ## Requirements

          - Node.js 22 or newer. Node 24 LTS is recommended.
          - Python 3.10 or newer linked with OpenSSL. On macOS, use Homebrew Python rather than the old system Python.
          - A browser logged into Instagram for posts that require authentication.

          ## Install on macOS

          Install Python and use nvm for Node.js:

          ```sh
          brew install python nvm
          mkdir -p ~/.nvm
          ```

          Add this to `~/.zshrc` if Homebrew did not add nvm automatically:

          ```sh
          export NVM_DIR="$HOME/.nvm"
          [ -s "$(brew --prefix nvm)/nvm.sh" ] && . "$(brew --prefix nvm)/nvm.sh"
          ```

          Reload the shell and install Node 24:

          ```sh
          source ~/.zshrc
          nvm install 24
          nvm use 24
          nvm alias default 24
          ```

          Install the latest `main` build directly from GitHub:

          ```sh
          npm uninstall -g yoinks 2>/dev/null || true
          npm install -g github:yaney01/yoinks
          ```

          Verify:

          ```sh
          node -v
          python3 -c 'import ssl,sys; print(sys.version); print(ssl.OPENSSL_VERSION)'
          yoinks --version
          yoinks --help
          ```

          The first download installs the managed backends here:

          ```text
          ~/.yoinks/bin/
          ├── yt-dlp
          └── gallery-dl/
          ```

          You do not need to install yt-dlp or gallery-dl separately.

          ## Use

          ```sh
          yoinks "https://youtu.be/..."
          yoinks "https://www.instagram.com/reel/.../"
          yoinks "https://www.instagram.com/p/.../"
          yoinks
          ```

          Downloads are saved to `~/Downloads`.

          - Videos and audio are individual files.
          - Galleries and mixed posts use a folder such as `~/Downloads/instagram-DbAY89yiZrJ/`.
          - Mixed Instagram posts offer `all media`, `images only`, and `videos only`.

          ## Instagram login

          yoinks checks local Chrome profiles for a non-expired Instagram `sessionid`, prioritizes the last-used profile, and passes only the selected profile to gallery-dl. This avoids repeatedly contacting Instagram with every Chrome profile.

          To force a browser or profile:

          ```sh
          YOINKS_COOKIES_FROM_BROWSER="chrome/.instagram.com:Default" yoinks "<instagram-url>"
          YOINKS_COOKIES_FROM_BROWSER="chrome/.instagram.com:Profile 1" yoinks "<instagram-url>"
          YOINKS_COOKIES_FROM_BROWSER="safari/.instagram.com" yoinks "<instagram-url>"
          YOINKS_COOKIES_FROM_BROWSER="firefox/.instagram.com" yoinks "<instagram-url>"
          ```

          If Instagram returns `429 Too Many Requests`, yoinks stops immediately. Do not keep retrying; wait and make one new attempt after the restriction clears.

          ## Update yoinks

          Update the application code from `main`:

          ```sh
          npm install -g github:yaney01/yoinks
          ```

          ## Update yt-dlp and gallery-dl

          Upstream tools are not silently changed during normal downloads. This avoids an unexpected upstream release breaking a working installation.

          Update both managed tools explicitly:

          ```sh
          yoinks --update-tools
          ```

          Updates are installed into temporary paths, verified with `--version`, and then swapped into `~/.yoinks/bin`. If installation fails, the current working copy is retained.

          To completely rebuild both tools:

          ```sh
          rm -rf ~/.yoinks/bin
          yoinks --update-tools
          ```

          A scheduled GitHub Actions smoke test also installs the latest upstream tools weekly, so packaging or runtime incompatibilities can be detected before a release.

          ## Media routing

          ```text
          Reels, single videos, audio
          └─ yt-dlp → resolution and MP3 choices

          Images, carousels, manga
          └─ gallery-dl → original media files

          Image + video mixed posts
          └─ gallery-dl → all / images only / videos only
          ```

          Instagram `/p/` links are inspected with gallery-dl first. A post containing exactly one video is handed to yt-dlp so resolution and audio choices remain available. Reels go directly to yt-dlp.

          ## Local development

          ```sh
          git clone https://github.com/yaney01/yoinks.git
          cd yoinks
          npm install
          npm run check
          npm link
          yoinks "<url>"
          ```

          ## Troubleshooting

          Check the active command and versions:

          ```sh
          which yoinks
          yoinks --version
          ~/.yoinks/bin/yt-dlp --version
          ~/.yoinks/bin/gallery-dl/bin/gallery-dl --version
          ```

          On macOS, the managed gallery-dl environment must report OpenSSL rather than LibreSSL:

          ```sh
          ~/.yoinks/bin/gallery-dl/bin/python -c 'import ssl; print(ssl.OPENSSL_VERSION)'
          ```

          If Chrome cookies cannot be read, close Chrome completely and retry once, or provide `YOINKS_COOKIES_FROM_BROWSER` explicitly.

          ## Fair use

          yoinks is a personal-archiving tool. Only download media you have the right to keep, and follow the platform's terms and applicable law.

          ## License

          [MIT](LICENSE)
          MD

      - name: Add permanent CI and upstream compatibility smoke test
        shell: bash
        run: |
          cat > .github/workflows/ci.yml <<'YAML'
          name: CI

          on:
            push:
              branches: [main]
            pull_request:
            workflow_dispatch:
            schedule:
              - cron: '17 4 * * 1'

          permissions:
            contents: read

          jobs:
            check:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 22
                    cache: npm
                - run: npm ci
                - run: npm run check

            upstream-smoke:
              if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 22
                    cache: npm
                - uses: actions/setup-python@v5
                  with:
                    python-version: '3.12'
                - run: npm ci
                - run: node dist/cli.js --update-tools
                - run: ~/.yoinks/bin/yt-dlp --version
                - run: ~/.yoinks/bin/gallery-dl/bin/gallery-dl --version
          YAML

      - name: Remove temporary workflows
        run: |
          rm -f .github/workflows/inspect-release-cleanup.yml
          rm -f .github/workflows/finalize-dual-engine-release.yml

      - name: Install and validate
        run: |
          npm install
          npm run check
          git diff --check

