name: Fix gallery message parser

on:
  push:
    branches:
      - agent/unify-downloader-paths
    paths:
      - .github/workflows/fix-gallery-message-parser.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unify-downloader-paths

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Correct gallery-dl message protocol parsing
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          source = Path('src/lib/gallerydl.ts')
          text = source.read_text()
          old = "if (value[0] === 2 && typeof value[1] === 'string') {"
          new = "if (value[0] === 3 && typeof value[1] === 'string') {"
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one parser match, found {text.count(old)}')
          source.write_text(text.replace(old, new))

          test = Path('src/lib/gallerydl.test.ts')
          text = test.read_text()
          old = "[2, 'https://cdn.example/1.jpg', {extension: 'jpg'}],\n    [2, 'https://cdn.example/2.mp4', {extension: 'mp4'}],"
          new = "[2, null, {title: 'Example post'}],\n    [3, 'https://cdn.example/1.jpg', {extension: 'jpg'}],\n    [3, 'https://cdn.example/2.mp4', {extension: 'mp4'}],"
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one test fixture match, found {text.count(old)}')
          test.write_text(text.replace(old, new))
          PY

      - run: npm install
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

      - name: Commit parser fix and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/fix-gallery-message-parser.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/gallerydl.ts src/lib/gallerydl.test.ts .github/workflows/fix-gallery-message-parser.yml
          git commit -m "fix gallery-dl message parsing"
          git push origin HEAD:agent/unify-downloader-paths
