name: Fix GitHub installation

on:
  push:
    branches:
      - fix/github-install-dist
    paths:
      - .github/workflows/fix-github-install.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/github-install-dist

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install development dependencies
        run: npm ci

      - name: Make GitHub installs use committed build output
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          pkg.version = '0.3.2'
          delete pkg.scripts.prepare
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`)

          const readmePath = 'README.md'
          let readme = fs.readFileSync(readmePath, 'utf8')
          readme = readme.replace(
            'The package includes a `prepare` script, so GitHub installation builds `dist/cli.js` automatically.',
            'The repository includes a verified `dist/cli.js`, so GitHub installation does not compile the project on the user’s machine.',
          )
          fs.writeFileSync(readmePath, readme)
          NODE

          npm install --package-lock-only --ignore-scripts

      - name: Test and build
        run: npm run check

      - name: Verify installable package
        shell: bash
        run: |
          test -x dist/cli.js || chmod +x dist/cli.js
          TARBALL="$(npm pack --silent)"
          PREFIX="$RUNNER_TEMP/yoinks-global"
          npm install -g "./$TARBALL" --prefix "$PREFIX"
          "$PREFIX/bin/yoinks" --version | grep -Fx '0.3.2'
          "$PREFIX/bin/yoinks" --help | grep -F 'yoinks — yoink videos'
          rm -f "$TARBALL"

      - name: Commit production build and remove one-time workflow
        shell: bash
        run: |
          git rm .github/workflows/fix-github-install.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json README.md
          git add -f dist
          git commit -m "fix GitHub installation without local build"
          git push origin HEAD:fix/github-install-dist
